services:
  Plex:
    image: lscr.io/linuxserver/plex:latest
    network_mode: host
    runtime: nvidia
    container_name: Plex
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ${PLEXAPP}:/config
      - ${MEDIA}:/plexmedia
    restart: unless-stopped